name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8
      
      - name: Check formatting with black
        run: black --check src/ tests/
      
      - name: Lint with flake8
        run: flake8 src/ tests/ --max-line-length=120 --extend-ignore=E203,W503

  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      
      - name: Install Playwright browsers
        run: playwright install chromium --with-deps
      
      - name: Run unit tests with coverage
        run: pytest tests/unit/ --cov=src --cov-report=term --cov-report=xml
      
      - name: Run contract tests
        run: pytest tests/contract/ -v
      
      - name: Run integration tests
        run: pytest tests/integration/ -v
      
      - name: Check coverage threshold
        run: |
          coverage report --fail-under=50

  build:
    runs-on: ubuntu-22.04
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: docker build -t browse-local:latest .
      
      - name: Test Docker image
        run: |
          docker run -d -p 8000:8000 --name test-container browse-local:latest
          sleep 5
          curl --fail http://localhost:8000/health || exit 1
          docker stop test-container
