openapi: 3.0.3
info:
  title: Web Page HTML Retrieval API
  description: |
    Retrieves HTML content from web pages with options to wait for rendering completion.
    Supports network-idle detection and CSS selector-based waiting.
  version: 1.0.0
  contact:
    name: API Support
  license:
    name: Proprietary

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.example.com
    description: Production (placeholder)

paths:
  /v1/html:
    post:
      summary: Retrieve HTML content from a web page (POST)
      description: |
        Renders a web page and returns the HTML content.
        Supports waiting for network idle or CSS selector matching before returning.
        Allows passing custom HTTP headers.
      operationId: postHtml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HtmlRequest'
      responses:
        '200':
          description: Successfully retrieved page content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlResponse'

        '404':
          description: Selector not found within timeout — error response includes HTML for debugging
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HtmlErrorDetailResponse'

        '422':
          description: Unprocessable entity (validation error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

      tags:
        - HTML Retrieval

  /health:
    get:
      summary: Health check endpoint
      description: |
        Returns 200 if the API and embedded browser are operational.
        Used for container health checks and monitoring.
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      tags:
        - Health

components:
  schemas:
    HtmlRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          minLength: 10
          maxLength: 2048
          description: Target URL to fetch
          example: https://example.com
        waitFor:
          type: string
          enum: [none, network-idle, selector]
          default: none
          description: Rendering wait strategy
        selector:
          type: string
          minLength: 1
          maxLength: 500
          description: CSS selector to wait for (required if waitFor=selector)
          example: .article-content
        headers:
          type: object
          description: Custom HTTP headers to send with the request
          additionalProperties:
            type: string
        timeout:
          type: integer
          minimum: 1000
          maximum: 120000
          default: 30000
          description: Timeout in milliseconds

    HtmlResponse:
      type: object
      required:
        - content
        - metadata
      properties:
        content:
          type: string
          description: |
            Raw HTML content of the rendered page (UTF-8 encoded).
            May include dynamically rendered content (JavaScript execution).
          example: |
            <!DOCTYPE html>
            <html>
            <head><title>Example Domain</title></head>
            <body>
            <h1>Example Domain</h1>
            <p>This domain is...</p>
            </body>
            </html>
        metadata:
          $ref: '#/components/schemas/ResponseMetadata'

    ResponseMetadata:
      type: object
      required:
        - url
        - status_code
        - duration_ms
        - timestamp
      properties:
        url:
          type: string
          format: uri
          description: Final URL after following redirects
          example: https://example.com
        status_code:
          type: integer
          description: HTTP status code of the target page
          example: 200
        duration_ms:
          type: integer
          description: Time spent rendering the page (milliseconds)
          example: 2345
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the response
          example: "2025-12-14T10:30:00Z"
        warnings:
          type: array
          items:
            type: string
          description: |
            Non-blocking issues encountered during rendering.
            Examples:
            - "Timeout reached before selector matched; returning partial content"
            - "Page returned non-HTML content type; returned as-is"
          example:
            - "Timeout reached (30s) before network idle; returning partial content"
        wait_strategy:
          type: string
          description: Applied wait strategy
          example: none
        selector_error:
          type: string
          nullable: true
          description: Error message when selector was not found
        partial_content:
          type: boolean
          nullable: true
          description: True if content may be incomplete

    HtmlErrorDetailResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: object
          required:
            - content
            - metadata
          properties:
            content:
              type: string
              description: Raw HTML content of the page at the time of error
            metadata:
              $ref: '#/components/schemas/ResponseMetadata'

    ErrorResponse:
      type: object
      required:
        - code
        - message
        - timestamp
      properties:
        code:
          type: string
          description: |
            Machine-readable error code.
            Examples: INVALID_URL, SELECTOR_REQUIRED, REQUEST_TIMEOUT, etc.
          example: INVALID_URL
        message:
          type: string
          description: Human-readable error message
          example: URL must be a valid HTTP or HTTPS URL
        details:
          type: object
          description: |
            Additional error context (structure varies by error type).
            Helps API consumers debug issues.
          additionalProperties: true
          example:
            url: not-a-url
            reason: missing scheme (http or https)
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the error response
          example: "2025-12-14T10:30:00Z"

    HealthResponse:
      type: object
      required:
        - status
        - timestamp
      properties:
        status:
          type: string
          enum:
            - healthy
            - degraded
            - unhealthy
          description: Health status of the service
          example: healthy
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp
          example: "2025-12-14T10:30:00Z"
        browser:
          type: object
          description: Browser availability status
          properties:
            connected:
              type: boolean
              example: true
            version:
              type: string
              example: Chromium 120.0.0

tags:
  - name: HTML Retrieval
    description: Page fetching and rendering operations
  - name: Health
    description: Service health and status checks

